name: External secret smoke checks

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke.yml

permissions:
  contents: write

jobs:
  neon:
    name: Validate Neon credentials
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run sanitized connection checks
        id: probe
        shell: bash
        run: |
          set +x
          set +e
          mkdir -p docs/mini-mvp/integration
          report=docs/mini-mvp/integration/SECRET_SMOKE_STATUS.md
          failures=0

          check_url() {
            local label="$1"
            local value="$2"
            local state detail output rc

            if [ -z "$value" ]; then
              state='FAIL'
              detail='secret is missing or empty'
              failures=$((failures + 1))
            else
              output="$(PGCONNECT_TIMEOUT=12 psql "$value" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc 'select 1' 2>/dev/null)"
              rc=$?
              if [ "$rc" -eq 0 ] && [ "$output" = '1' ]; then
                state='PASS'
                detail='connection and read-only query succeeded'
              else
                state='FAIL'
                detail='connection, authentication or database selection failed'
                failures=$((failures + 1))
              fi
            fi

            printf '| %s | %s | %s |\n' "$label" "$state" "$detail" >> "$report"
          }

          cat > "$report" <<EOF
          # External secret smoke status

          Generated by GitHub Actions. Secret values and connection details are not recorded.

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          EOF

          check_url 'Neon runtime URL' "$DATABASE_URL"
          check_url 'Neon direct URL' "$DATABASE_DIRECT_URL"

          printf '\nFailures: %s\n' "$failures" >> "$report"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Commit sanitized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record external secret smoke result'
            git push
          fi

      - name: Fail when credentials are invalid
        if: steps.probe.outputs.failures != '0'
        run: exit 1
