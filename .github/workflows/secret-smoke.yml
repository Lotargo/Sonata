name: External secret smoke checks

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke.yml

permissions:
  contents: read

jobs:
  neon-runtime:
    name: Neon runtime connection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Execute read-only query
        shell: bash
        run: |
          set +x
          test -n "$DATABASE_URL"
          test "$(PGCONNECT_TIMEOUT=12 psql "$DATABASE_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc 'select 1')" = "1"
