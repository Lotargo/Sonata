name: Grafana OTLP endpoint smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke-grafana.yml

permissions:
  contents: write

jobs:
  grafana:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe Grafana OTLP endpoint
        id: probe
        shell: bash
        run: |
          set +x
          mkdir -p docs/mini-mvp/integration
          result='FAIL'
          detail='endpoint secret is missing or empty'

          if [ -n "$GRAFANA_OTLP_ENDPOINT" ]; then
            url="${GRAFANA_OTLP_ENDPOINT%/}"
            case "$url" in
              */v1/traces|*/v1/metrics|*/v1/logs) ;;
              *) url="${url}/v1/traces" ;;
            esac

            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -X POST \
              -H 'Content-Type: application/x-protobuf' \
              --data-binary '' \
              "$url" 2>/dev/null || true)"

            case "$code" in
              200|202|204|400|401|403|405|415)
                result='WARN'
                detail="endpoint is reachable; authorization was not tested (HTTP ${code})"
                ;;
              404)
                detail='endpoint is reachable, but the OTLP path was not found'
                ;;
              *)
                detail="endpoint probe failed with HTTP ${code:-000}"
                ;;
            esac
          fi

          cat > docs/mini-mvp/integration/SECRET_SMOKE_GRAFANA.md <<EOF
          # Grafana OTLP endpoint smoke status

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          | Grafana OTLP endpoint | ${result} | ${detail} |
          EOF

          if [ "$result" = 'FAIL' ]; then echo 'failed=true' >> "$GITHUB_OUTPUT"; else echo 'failed=false' >> "$GITHUB_OUTPUT"; fi

      - name: Commit sanitized report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_GRAFANA.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record Grafana OTLP smoke result' && git push; fi

      - name: Fail when endpoint is invalid
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
