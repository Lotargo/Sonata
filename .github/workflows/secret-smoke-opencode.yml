name: OpenCode Zen secret smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke-opencode.yml

permissions:
  contents: write

jobs:
  opencode:
    name: Validate OpenCode Zen credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run sanitized inference check
        id: probe
        shell: bash
        run: |
          set +x
          set +e
          mkdir -p docs/mini-mvp/integration
          report=docs/mini-mvp/integration/SECRET_SMOKE_OPENCODE.md
          result='FAIL'
          detail='secret is missing or empty'

          if [ -n "$OPENCODE_ZEN_API_KEY" ]; then
            code="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              --request POST \
              --header "Authorization: Bearer ${OPENCODE_ZEN_API_KEY}" \
              --header 'Content-Type: application/json' \
              'https://opencode.ai/zen/v1/chat/completions' \
              --data '{"model":"nemotron-3-ultra-free","messages":[{"role":"user","content":"Reply only OK."}],"max_tokens":1,"stream":false}' 2>/dev/null)"

            case "$code" in
              200)
                result='PASS'
                detail='authenticated inference succeeded'
                ;;
              401|403)
                detail='authentication was rejected'
                ;;
              402|429)
                detail='credential was recognized, but quota or billing blocks inference'
                ;;
              *)
                detail="inference probe failed with HTTP ${code:-000}"
                ;;
            esac
          fi

          cat > "$report" <<EOF
          # OpenCode Zen secret smoke status

          Generated by GitHub Actions. Secret values and response bodies are not recorded.

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          | OpenCode Zen | ${result} | ${detail} |
          EOF

          if [ "$result" = 'PASS' ]; then
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit sanitized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_OPENCODE.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record OpenCode Zen secret smoke result'
            git push
          fi

      - name: Fail when credential is invalid
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
