name: Object storage secret smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke-storage.yml

permissions:
  contents: write

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
      EXPECTED_BUCKET: sonata-private
    steps:
      - uses: actions/checkout@v6

      - name: Ensure AWS-compatible client
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check --quiet --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Probe S3-compatible storage
        id: probe
        shell: bash
        run: |
          set +x
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p docs/mini-mvp/integration

          credentials_result='FAIL'
          credentials_detail='one or more storage secrets are missing or empty'
          bucket_result='FAIL'
          bucket_detail="bucket '${EXPECTED_BUCKET}' could not be checked"

          if [ -n "$OBJECT_STORAGE_ENDPOINT" ] && [ -n "$OBJECT_STORAGE_REGION" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            config_file="$(mktemp)"
            list_error="$(mktemp)"
            head_error="$(mktemp)"
            export AWS_CONFIG_FILE="$config_file"
            printf '[default]\nregion = %s\ns3 =\n    addressing_style = path\n' "$OBJECT_STORAGE_REGION" > "$config_file"

            listed_bucket="$(aws s3api list-buckets \
              --endpoint-url "$OBJECT_STORAGE_ENDPOINT" \
              --region "$OBJECT_STORAGE_REGION" \
              --query "Buckets[?Name=='${EXPECTED_BUCKET}'].Name | [0]" \
              --output text 2>"$list_error")"
            list_rc=$?

            aws s3api head-bucket \
              --bucket "$EXPECTED_BUCKET" \
              --endpoint-url "$OBJECT_STORAGE_ENDPOINT" \
              --region "$OBJECT_STORAGE_REGION" \
              >/dev/null 2>"$head_error"
            head_rc=$?

            if [ "$list_rc" -eq 0 ] || [ "$head_rc" -eq 0 ]; then
              credentials_result='PASS'
              credentials_detail='S3-compatible credentials were accepted'
            elif grep -Eqi 'InvalidAccessKeyId|SignatureDoesNotMatch|AccessDenied|Forbidden|401|403' "$list_error" "$head_error"; then
              credentials_detail='authentication or request signature was rejected'
            elif grep -Eqi 'Could not connect|Name or service not known|Temporary failure in name resolution|SSL validation failed' "$list_error" "$head_error"; then
              credentials_detail='endpoint, region, DNS or TLS configuration is invalid'
            else
              credentials_detail='S3 compatibility probe failed'
            fi

            if [ "$head_rc" -eq 0 ] || { [ "$list_rc" -eq 0 ] && [ "$listed_bucket" = "$EXPECTED_BUCKET" ]; }; then
              bucket_result='PASS'
              bucket_detail="bucket '${EXPECTED_BUCKET}' exists and is accessible"
            elif [ "$list_rc" -eq 0 ]; then
              bucket_detail="bucket '${EXPECTED_BUCKET}' does not exist"
            else
              bucket_detail='bucket could not be checked because storage authentication failed'
            fi

            rm -f "$config_file" "$list_error" "$head_error"
          fi

          cat > docs/mini-mvp/integration/SECRET_SMOKE_STORAGE.md <<EOF
          # Object storage secret smoke status

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          | Object storage credentials | ${credentials_result} | ${credentials_detail} |
          | Object storage bucket | ${bucket_result} | ${bucket_detail} |
          EOF

          if [ "$credentials_result" = 'PASS' ] && [ "$bucket_result" = 'PASS' ]; then
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit sanitized report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_STORAGE.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record object storage secret smoke result' && git push; fi

      - name: Fail when invalid
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
