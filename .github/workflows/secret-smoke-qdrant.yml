name: Qdrant secret smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke-qdrant.yml

permissions:
  contents: write

jobs:
  qdrant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe Qdrant
        id: probe
        shell: bash
        run: |
          set +x
          mkdir -p docs/mini-mvp/integration
          result='FAIL'
          detail='URL or API key is missing or empty'
          if [ -n "$QDRANT_URL" ] && [ -n "$QDRANT_API_KEY" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "api-key: ${QDRANT_API_KEY}" \
              "${QDRANT_URL%/}/collections" 2>/dev/null || true)"
            case "$code" in
              200) result='PASS'; detail='authenticated collection listing succeeded' ;;
              401|403) detail='authentication was rejected' ;;
              404) detail='URL does not point to the Qdrant API root' ;;
              *) detail="API probe failed with HTTP ${code:-000}" ;;
            esac
          fi
          cat > docs/mini-mvp/integration/SECRET_SMOKE_QDRANT.md <<EOF
          # Qdrant secret smoke status

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          | Qdrant | ${result} | ${detail} |
          EOF
          if [ "$result" = 'PASS' ]; then echo 'failed=false' >> "$GITHUB_OUTPUT"; else echo 'failed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Commit sanitized report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_QDRANT.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record Qdrant secret smoke result' && git push; fi

      - name: Fail when invalid
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
