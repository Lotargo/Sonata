name: LangSearch secret smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secret-smoke-langsearch.yml

permissions:
  contents: write

jobs:
  langsearch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe LangSearch
        id: probe
        shell: bash
        run: |
          set +x
          mkdir -p docs/mini-mvp/integration
          result='FAIL'
          detail='secret is missing or empty'
          if [ -n "$LANGSEARCH_API_KEY" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
              -X POST \
              -H "Authorization: Bearer ${LANGSEARCH_API_KEY}" \
              -H 'Content-Type: application/json' \
              'https://api.langsearch.com/v1/web-search' \
              -d '{"query":"Sonata credential smoke check","count":1,"summary":false}' 2>/dev/null || true)"
            case "$code" in
              200) result='PASS'; detail='authenticated search succeeded' ;;
              401|403) detail='authentication was rejected' ;;
              429) detail='credential was recognized, but quota is exhausted' ;;
              *) detail="search probe failed with HTTP ${code:-000}" ;;
            esac
          fi
          cat > docs/mini-mvp/integration/SECRET_SMOKE_LANGSEARCH.md <<EOF
          # LangSearch secret smoke status

          | Integration | Result | Sanitized detail |
          |---|---:|---|
          | LangSearch | ${result} | ${detail} |
          EOF
          if [ "$result" = 'PASS' ]; then echo 'failed=false' >> "$GITHUB_OUTPUT"; else echo 'failed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Commit sanitized report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mini-mvp/integration/SECRET_SMOKE_LANGSEARCH.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record LangSearch secret smoke result' && git push; fi

      - name: Fail when invalid
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
