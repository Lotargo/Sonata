version: 1

secrets:
  opencode_zen_master_key:
    source: env
    key: OPENCODE_ZEN_API_KEY
    required: true

  neon_database_url:
    source: env
    key: DATABASE_URL
    required: true

  neon_database_direct_url:
    source: env
    key: DATABASE_DIRECT_URL
    required: true

  langsearch_api_key:
    source: env
    key: LANGSEARCH_API_KEY
    required: true

  qdrant_endpoint:
    source: env
    key: QDRANT_URL
    required: true

  qdrant_api_key:
    source: env
    key: QDRANT_API_KEY
    required: true

  openwebui_internal_secret:
    source: env
    key: OPENWEBUI_INTERNAL_SECRET
    required: true

  grafana_otlp_endpoint:
    source: env
    key: GRAFANA_OTLP_ENDPOINT
    required: false

  grafana_otlp_headers:
    source: file
    path: /etc/secrets/grafana-otlp-headers
    required: false

  r2_endpoint:
    source: env
    key: R2_ENDPOINT
    required: false

  r2_access_key:
    source: env
    key: R2_ACCESS_KEY_ID
    required: false

  r2_secret_key:
    source: env
    key: R2_SECRET_ACCESS_KEY
    required: false
