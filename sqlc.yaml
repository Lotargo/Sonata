version: "2"

sql:
  - name: sonata
    engine: postgresql
    schema: internal/database/migrations
    queries: internal/database/queries
    strict_order_by: true
    gen:
      go:
        package: dbgen
        out: internal/database/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 0
        omit_unused_structs: true
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
        initialisms:
          - id
          - api
          - url
